<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Từ vựng Hình ảnh — Visual Vocabulary (Vietnamese → English)</title>
<meta name="description" content="Thư viện từ vựng Tiếng Việt sang Tiếng Anh qua hình ảnh minh họa: chủ đề từ điển hình ảnh và bài học CEFR A1–C2.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c; --panel:#111114; --panel2:#17171b; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#f3efe8; --sub:#a8a49b; --mute:#6f6c66; --gold:#c8a96b; --gold-ink:#1a1407;
  --h-s:22%; --h-l1:19%; --h-l2:9%;
  --wcb:#8db8ff; --wcp:#6fa1e6; --wcx:#1b1b20; --card:330px; --tile:190px; --hdr:96px; --pad:clamp(16px,3vw,40px);
  --serif:'Instrument Serif','Cormorant Garamond',Georgia,serif;
  --sans:'Plus Jakarta Sans','Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#ffffff; --panel:#ffffff; --panel2:#f4f5f9; --line:rgba(16,24,40,.09); --line2:rgba(16,24,40,.18);
  --text:#16181d; --sub:#535a66; --mute:#868d99; --gold:#1f56b3; --gold-ink:#fff;
  --wcb:#1b4b9b; --wcp:#3a78c4; --wcx:#f6f7fb;
  --h-s:30%; --h-l1:91%; --h-l2:82%;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;transition:background-color .25s,color .25s}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Header ---------- */
.hdr{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line);transition:transform .35s var(--ease)}
.hdr.hide{transform:translateY(-100%)}
.hdr-row{display:flex;align-items:center;gap:14px;padding:10px var(--pad)}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.brand-mark{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:16px;color:var(--gold);letter-spacing:-.02em;font-weight:700}
.brand-name{font-family:var(--serif);font-size:22px;letter-spacing:.005em;line-height:1}
.brand-name em{color:var(--gold);font-style:italic}
.search{flex:1 1 auto;max-width:560px;margin-left:auto;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.search input{width:100%;height:40px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 54px 0 40px;font:500 .88rem var(--sans);outline:0;transition:border-color .2s,background .2s}
.search input::placeholder{color:var(--mute)}
.search input:focus{border-color:var(--gold)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:600 .68rem var(--sans);color:var(--mute);border:1px solid var(--line2);border-radius:6px;padding:2px 6px}
.tools{display:flex;gap:6px;align-items:center}
.ibtn{height:40px;min-width:40px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 .78rem var(--sans);color:var(--sub);transition:border-color .2s,color .2s,background .2s}
.ibtn:hover{border-color:var(--line2);color:var(--text)}
.ibtn.on{border-color:var(--gold);color:var(--gold)}
.dens{display:inline-flex;border:1px solid var(--line);border-radius:99px;background:var(--panel);overflow:hidden}
.dens button{height:38px;padding:0 12px;font:700 .72rem var(--sans);color:var(--mute)}
.dens button.on{color:var(--gold-ink);background:var(--gold)}
.chips{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 var(--pad) 10px}
.chips::-webkit-scrollbar{display:none}
.chip-nav{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:99px;font:600 .8rem var(--sans);color:var(--sub);border:1px solid transparent;transition:color .2s,background .2s,border-color .2s;white-space:nowrap}
.chip-nav i{width:7px;height:7px;border-radius:50%;background:var(--ac,var(--gold))}
.chip-nav small{font:600 .7rem var(--sans);color:var(--mute)}
.chip-nav:hover{color:var(--text);background:var(--panel)}
.chip-nav.on{color:var(--text);background:var(--panel);border-color:var(--line2)}

/* ---------- Hero ---------- */
.hero{position:relative;padding:clamp(22px,3.4vw,46px) var(--pad);border-bottom:1px solid var(--line);overflow:hidden;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px clamp(24px,5vw,80px);align-items:end}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 300px at 85% -20%,color-mix(in srgb,var(--gold) 16%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.eyebrow{font:700 .68rem var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.1rem,4.6vw,4rem);line-height:1.04;letter-spacing:-.015em;margin:12px 0 12px}
.hero h1 em{color:var(--gold)}
.hero p.lead{max-width:58ch;color:var(--sub);font-size:clamp(.86rem,1.05vw,.98rem);line-height:1.6}
.hero-r{display:flex;flex-direction:column;gap:20px;align-items:flex-end}
.stats{display:flex;gap:clamp(18px,3vw,44px)}
.stat b{display:block;font:400 clamp(1.5rem,2.6vw,2.2rem)/1 var(--serif)}
.stat span{font:600 .62rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:900px){.hero{grid-template-columns:1fr}.hero-r{align-items:flex-start}.cta{justify-content:flex-start}}
@media (max-width:700px){.hero p.lead{display:none}.stats{gap:20px}.hero{padding-top:18px;padding-bottom:18px}}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:99px;font:700 .84rem var(--sans);border:1px solid var(--line2);color:var(--text);transition:transform .2s var(--ease),background .2s,border-color .2s}
.btn:hover{border-color:var(--gold);transform:translateY(-1px)}
.btn.pri{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:36px;padding:0 14px;font-size:.78rem}

/* ---------- Grids & tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:2px}
.band{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px var(--pad) 14px;margin-top:14px;border-top:1px solid var(--line)}
.grid>.band:first-child{margin-top:0;border-top:0}
.band-l{display:flex;align-items:center;gap:16px;min-width:0}
.lv{font:400 clamp(1.7rem,3vw,2.5rem)/1 var(--serif);color:var(--ac,var(--gold));min-width:2.1ch}
.band h2{font:700 .95rem var(--sans);letter-spacing:.01em}
.band p{font:500 .78rem var(--sans);color:var(--mute);margin-top:3px}
.band a.more{font:700 .76rem var(--sans);color:var(--sub);white-space:nowrap;display:inline-flex;gap:6px;align-items:center;transition:color .2s}
.band a.more:hover{color:var(--gold)}

/* ---------- Banner (topic / collection) ---------- */
.banner{position:relative;overflow:hidden;border-bottom:1px solid var(--line);isolation:isolate}
.banner-bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(34px) saturate(1.15);opacity:.55;z-index:-2;transform:scale(1.1)}
.banner::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 35%,transparent),var(--bg) 96%)}
.banner-in{padding:clamp(24px,4vw,52px) var(--pad) clamp(22px,3vw,34px);display:flex;flex-wrap:wrap;gap:22px 40px;justify-content:space-between;align-items:flex-end}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:600 .74rem var(--sans);color:var(--mute);margin-bottom:16px}
.crumbs a:hover{color:var(--gold)}
.crumbs span.sep{opacity:.5}
.banner h1{font:400 clamp(2.1rem,5.2vw,4.4rem)/1.06 var(--serif);letter-spacing:-.015em}
.banner .sub-en{font:600 clamp(1rem,1.8vw,1.35rem)/1.3 var(--sans);color:var(--gold);margin-top:6px}
.banner .meta{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:16px;font:600 .82rem var(--sans);color:var(--sub)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;border:1px solid var(--line2);font:700 .68rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ac,var(--gold))}
.pill.en-pill{background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:color-mix(in srgb,var(--gold) 45%,transparent);color:var(--gold);text-transform:none;letter-spacing:.02em;font-size:.76rem}
.prog{display:inline-flex;align-items:center;gap:9px}
.prog b{display:inline-block;width:110px;height:4px;border-radius:9px;background:var(--line2);overflow:hidden;position:relative}
.prog b i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);width:var(--p,0%)}
.banner .actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px var(--pad);border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;background:var(--panel);overflow:hidden}
.seg a,.seg button{height:34px;padding:0 15px;font:700 .74rem var(--sans);color:var(--mute);display:inline-flex;align-items:center;gap:6px;transition:color .2s,background .2s}
.seg .on{background:var(--gold);color:var(--gold-ink)}
.seg a:not(.on):hover,.seg button:not(.on):hover{color:var(--text)}
.filter{position:relative;flex:1 1 220px;max-width:340px}
.filter input{width:100%;height:36px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 14px;font:500 .82rem var(--sans);outline:0}
.filter input:focus{border-color:var(--gold)}
.count{font:600 .76rem var(--sans);color:var(--mute)}
.tb-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{grid-column:1/-1;padding:90px var(--pad);text-align:center;color:var(--sub)}
.empty b{display:block;font:400 2rem var(--serif);color:var(--text);margin-bottom:8px}
.sec-title{padding:30px var(--pad) 16px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.sec-title h2{font:400 clamp(1.5rem,2.6vw,2.2rem) var(--serif)}
.sec-title span{font:600 .78rem var(--sans);color:var(--mute)}
.nextprev{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:2px}
.np{display:flex;flex-direction:column;gap:6px;padding:clamp(22px,4vw,44px) var(--pad);background:var(--panel);transition:background .25s}
.np:hover{background:var(--panel2)}
.np small{font:700 .64rem var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.np b{font:400 clamp(1.3rem,2.6vw,2.2rem)/1.1 var(--serif)}
.np.next{text-align:right;align-items:flex-end}
.np.off{opacity:.35;pointer-events:none}
.sentinel{height:2px}
.foot{padding:40px var(--pad) 60px;color:var(--mute);font:500 .74rem/1.6 var(--sans);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid var(--line);margin-top:2px}
.foot a{color:var(--sub);text-decoration:underline;text-underline-offset:3px}

/* ---------- Study overlay (WITH MUCH BIGGER PICTURE) ---------- */
.study{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) clamp(370px,34vw,520px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.study.open{opacity:1;visibility:visible}
.st-stage{position:relative;overflow:hidden;background:#050506;display:grid;place-items:center;touch-action:pan-y;padding:56px 64px 36px}
.st-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(46px) brightness(.55) saturate(1.2);transform:scale(1.1)}
/* Upgraded large study image filling the stage area */
.st-img{
  position:relative;
  width:min(86%, 780px);
  height:min(80vh, 680px);
  max-width:calc(100% - 110px);
  max-height:calc(100% - 90px);
  object-fit:contain;
  background:#f4f4f5;
  padding:24px;
  border-radius:26px;
  box-shadow:0 30px 90px rgba(0,0,0,.55);
  cursor:zoom-in;
  transition:opacity .3s,transform .3s var(--ease);
}
.st-img.swap{opacity:0;transform:scale(.97)}
.st-typo{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:80px;font:400 clamp(3rem,9vw,7.5rem)/1.05 var(--serif);color:#f3efe8;background:linear-gradient(155deg,hsl(var(--h,40) 22% 19%),hsl(var(--h,40) 22% 8%));overflow-wrap:anywhere}
.st-stage.noimg .st-typo{display:grid}
.st-stage.noimg .st-img,.st-stage.noimg .st-bg,.st-stage.noimg .st-zoom{display:none}
.study.guess:not(.revealed) .st-typo{filter:blur(26px)}
.st-top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;gap:12px;align-items:center;padding:16px 18px;color:#f3efe8;background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent)}
.st-top .ibtn{background:rgba(10,10,12,.55);border-color:rgba(255,255,255,.16);color:#f3efe8;backdrop-filter:blur(8px)}
.st-crumb{font:700 .74rem var(--sans);letter-spacing:.08em;text-transform:uppercase;opacity:.88;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-count{margin-left:auto;font:700 .78rem var(--sans);letter-spacing:.06em;white-space:nowrap}
.st-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:56px;height:56px;border-radius:50%;background:rgba(10,10,12,.55);border:1px solid rgba(255,255,255,.22);color:#f3efe8;display:grid;place-items:center;backdrop-filter:blur(8px);transition:background .2s,transform .2s var(--ease)}
.st-arrow:hover{background:rgba(10,10,12,.85);transform:translateY(-50%) scale(1.06)}
.st-arrow.prev{left:20px}.st-arrow.next{right:20px}
.st-zoom{position:absolute;right:18px;bottom:16px;z-index:5;font:700 .7rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#f3efe8;background:rgba(10,10,12,.55);border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:8px 14px;backdrop-filter:blur(8px)}
.st-panel{display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}
.st-scroll{flex:1;overflow-y:auto;padding:28px clamp(22px,2.6vw,38px) 18px;min-height:0}
.st-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.st-wordrow{display:flex;align-items:center;gap:10px;margin:16px 0 6px;flex-wrap:wrap}
.st-word{font:600 clamp(2.1rem,4.1vw,3.5rem)/1.08 'Noto Sans',var(--serif);letter-spacing:-.015em;overflow-wrap:anywhere;transition:filter .3s;color:var(--text)}
.st-en-sub{display:flex;align-items:center;gap:10px;margin:4px 0 8px;flex-wrap:wrap}
.st-en-word{font:700 clamp(1.25rem,2.1vw,1.65rem)/1.2 'Noto Sans',var(--sans);color:var(--wcb)}
.audio{flex:0 0 auto;height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);display:inline-flex;align-items:center;gap:6px;font:700 .72rem var(--sans);color:var(--gold);transition:background .2s,color .2s}
.audio:hover,.audio.speaking{background:var(--gold);color:var(--gold-ink)}
.st-details{transition:filter .3s,opacity .3s}
.study.guess:not(.revealed) .st-word,.study.guess:not(.revealed) .st-en-sub,.study.guess:not(.revealed) .st-details{filter:blur(14px);user-select:none}
.lbl{font:700 .64rem var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px}
.st-def-en{font:700 1.14rem/1.45 'Noto Sans',var(--sans);color:var(--wcb);margin-bottom:4px}
.st-def{font:500 1.02rem/1.6 var(--sans);color:var(--text)}
.st-ex{display:flex;flex-direction:column;gap:10px}
.st-ex q{quotes:none;display:block;font:400 1.15rem/1.45 var(--serif);color:var(--sub);padding-left:14px;border-left:2px solid var(--line2)}
.st-ex q strong{color:var(--gold);font-weight:600}
.st-link{display:inline-flex;gap:6px;margin-top:22px;font:700 .74rem var(--sans);color:var(--sub)}
.st-link:hover{color:var(--gold)}
.reveal{display:none;margin:20px 0 0;width:100%;justify-content:center}
.study.guess:not(.revealed) .reveal{display:inline-flex}
.st-foot{border-top:1px solid var(--line);padding:14px clamp(18px,2.2vw,30px) calc(14px + env(safe-area-inset-bottom))}
.st-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.st-tools .ibtn{height:34px;font-size:.72rem;padding:0 11px}
.st-dock{display:flex;align-items:center;gap:14px}
.st-dock .btn{height:42px;padding:0 16px}
.st-prog{flex:1;text-align:center;font:700 .72rem var(--sans);color:var(--mute);letter-spacing:.06em}
.st-prog div{height:3px;border-radius:9px;background:var(--line2);margin-top:8px;overflow:hidden}
.st-prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:none;place-items:center;cursor:zoom-out;padding:30px}
.lightbox.open{display:grid}
.lightbox img{max-width:92vw;max-height:90vh;width:min(92vw,860px);height:min(88vh,760px);object-fit:contain;background:#f4f4f5;padding:24px;border-radius:24px}
.lightbox button{position:absolute;top:16px;right:20px;font-size:34px;color:#fff;line-height:1}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:90;background:var(--text);color:var(--bg);font:700 .78rem var(--sans);padding:10px 18px;border-radius:99px;opacity:0;transition:.3s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.view{min-height:60vh;animation:fade .45s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- LanGeek-style word cards (Vietnamese -> English) ---------- */
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--card)),1fr));gap:20px;padding:24px var(--pad) 36px;align-items:stretch}
.wc{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 2px 16px rgba(16,24,40,.06);padding:24px 20px 20px;font-family:'Noto Sans',var(--sans);transition:box-shadow .25s,transform .25s var(--ease),border-color .2s;min-width:0}
[data-theme="dark"] .wc{box-shadow:none}
.wc:hover{box-shadow:0 10px 34px rgba(16,24,40,.12);transform:translateY(-2px)}
[data-theme="dark"] .wc:hover{border-color:var(--line2);box-shadow:0 10px 34px rgba(0,0,0,.4)}
.wc-img{position:relative;display:grid;place-items:center;height:190px;margin-bottom:20px;background:var(--panel2);border-radius:18px;padding:10px}
.wc-img img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain;border-radius:14px;opacity:0;transition:opacity .4s}
.wc-img img.in{opacity:1}
.wc-img .ph{position:absolute;width:min(72%,200px);height:128px;border-radius:20px;background:var(--panel2);display:grid;place-items:center;font:400 3.4rem/1 var(--serif);color:var(--mute);opacity:.8}
.wc-img img.in + .ph{display:none}
.wc-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wc-w{font:700 17px/1.3 'Noto Sans',var(--sans);color:var(--wcb);overflow-wrap:anywhere}
.wc-w:hover{text-decoration:underline;text-underline-offset:3px}

.tray{position:fixed;left:50%;bottom:18px;transform:translate(-50%,150%);z-index:55;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 20px);background:var(--panel);border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.25);border-radius:22px;padding:10px 12px 10px 14px;transition:transform .4s var(--ease)}

.tc-p{font:700 10.5px 'Noto Sans',var(--sans);color:var(--wcp)}
.tc-d{margin-top:5px;font:500 12.5px/1.4 'Noto Sans',var(--sans);color:var(--sub)}
.tc-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--gold)}
.tc.is-done{border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.tc.is-done .tc-w::after{content:" ✓";color:var(--gold)}

/* ---- search (supports both Vietnamese & English queries) ---- */
function runSearch(q) {
  const s = q.trim().toLowerCase(); if (!s) return { topics: [], words: [] };
  const topics = Object.values(TBY).filter(t => t.title.toLowerCase().includes(s) || t.enTitle.toLowerCase().includes(s));
  const scored = [];
  for (const w of ALLWORDS) {
    let sc = 9;
    if (w.lw === s || w.len === s) sc = 0;
    else if (w.lw.startsWith(s) || w.len.startsWith(s)) sc = 1;
    else if (w.lw.includes(s) || w.len.includes(s)) sc = 2;
    else if (w.ld.includes(s)) sc = 3;
    if (sc < 9) scored.push([sc, w]);
  }
  scored.sort((a, b) => a[0] - b[0]);
  return { topics, words: scored.map(x => x[1]) };
}
function viewSearch(q) {
  const res = runSearch(q);
  S.all = res.words;
  VIEW.innerHTML = `
  <section class="banner"><div class="banner-bg" style="background:linear-gradient(135deg,var(--gold),transparent)"></div>

/* ---- chunked word grid ---- */
function mountGrid() {
  const host = $('#wgrid'); if (!host) return;
  S.io && S.io.disconnect();
  host.innerHTML = ''; S.shown = 0; host.className = 'grid words ' + (S.view === 'cards' ? 'cards' : 'tgrid compact');
  if (!S.list.length) { host.innerHTML = `<div class="empty"><b>Không có từ nào</b>${S.st === 'done' ? 'Nhấn phím K khi học để đánh dấu từ đã thuộc.' : 'Hãy thử xóa bộ lọc tìm kiếm.'}</div>`; return; }
  moreWords();
  const sent = $('#sent');
  S.io = new IntersectionObserver(es => { if (es[0].isIntersecting) { moreWords(); if (S.shown < S.list.length) { S.io.unobserve(sent); S.io.observe(sent); } } }, { rootMargin: '1400px 0px' });
  S.io.observe(sent);
}
function moreWords(n = 96, upto) {
  const host = $('#wgrid'); if (!host || S.shown >= S.list.length) return;
  const end = Math.min(S.list.length, upto != null ? Math.max(upto, S.shown + 1) : S.shown + n);
  let html = ''; for (let i = S.shown; i < end; i++) html += S.view === 'cards' ? wordCard(S.list[i], i, S.base) : wordTile(S.list[i], i, S.base);
  host.insertAdjacentHTML('beforeend', html); S.shown = end; updateCmpUI();
}

  if (S.depth) { S.depth = 0; history.back(); } else go('#' + S.base, true);
}
function stepTo(i) {
  const n = S.list.length; if (!n) return;
  S.si = (i % n + n) % n; S.revealed = false;
  history.replaceState(null, '', '#' + S.base + '?i=' + (S.si + 1));
  renderStudy();
}
const step = d => stepTo(S.si + d);
function hlExample(ex, word) {
  const s = esc(ex);
  try { return s.replace(new RegExp('\\b(' + reEsc(esc(word)) + '\\w*)', 'gi'), '<strong>$1</strong>'); } catch (e) { return s; }
}
function renderStudy() {
  const w = S.list[S.si]; if (!w) return;
  ensureVietnameseWord(w);
  ST.classList.toggle('guess', S.guess); ST.classList.toggle('revealed', !!S.revealed);
  ST.style.setProperty('--h', w.h);
  stStage.classList.toggle('noimg', !w.ph);
  if (w.ph) {
    stImg.classList.add('swap');
    stImg.alt = w.w + ' (' + w.en + ')';
    stImg.src = w.ph;
    $('#stBg').style.backgroundImage = `url("${w.ph}")`;
  }
  $('#stTypo').textContent = w.w;
  $('#stCrumb').textContent = w.t.col.short + ' · ' + w.t.title;
  $('#stCount').textContent = fmt(S.si + 1) + ' / ' + fmt(S.list.length);
  $('#stTopic').innerHTML = `<i style="background:${w.t.col.ac}"></i>${esc(w.t.col.short)}${w.t.n ? ' · ' + esc(w.t.n) : ''}`;
  $('#stPos').textContent = w.p || 'word';
  // Main word is Vietnamese; subtitle + meaning is English word + English definition
  $('#stWord').textContent = w.w;
  $('#stEnWord').textContent = 'EN: ' + w.en;
  $('#stDefEn').textContent = w.en + ' (' + (w.p || 'word') + ')';
  $('#stDef').textContent = w.d || 'No definition available.';
  $('#stEx').innerHTML = w.e.map(e => `<q>${hlExample(e, w.en)}</q>`).join('');
  $('#stExWrap').style.display = w.e.length ? '' : 'none';
  const src = $('#stSrc'); if (w.t.col.id !== 'pic') { src.style.display = ''; src.href = `https://langeek.co/en/vocab/subcategory/${w.t.id}/word-list`; } else src.style.display = 'none';
  $('#stProgTxt').textContent = Math.round((S.si + 1) / S.list.length * 100) + '%';
  $('#stProgBar').style.width = (S.si + 1) / S.list.length * 100 + '%';
  const ln = isLearned(w); $('#stLearn').classList.toggle('on', ln); $('#stCmp').classList.toggle('on', S.cmp.includes(w));
  $('#stGuess').classList.toggle('on', S.guess); $('#stShuf').classList.toggle('on', !!S.shuf);
  $('#stPlay').classList.toggle('on', !!S.play);
  const nx = S.list[(S.si + 1) % S.list.length]; if (nx && nx.ph) { const p = new Image(); p.src = nx.ph; }
  $('.st-scroll').scrollTop = 0;
  store.set('vv.last', { hash: '#' + S.base + '?i=' + (S.si + 1), label: w.t.title.split(' (')[0] + ' — ' + w.w, sub: w.en + ' · study mode' });
}
stImg.addEventListener('load', () => stImg.classList.remove('swap'));
stImg.addEventListener('error', () => { stStage.classList.add('noimg'); stImg.classList.remove('swap'); });
const reveal = () => { if (!S.revealed) { S.revealed = true; ST.classList.add('revealed'); } };
const toggleReveal = () => { if (S.guess && !S.revealed) reveal(); else if (S.guess) { S.revealed = false; ST.classList.remove('revealed'); } };
function toggleGuess() { S.guess = !S.guess; S.revealed = false; renderStudy(); toast(S.guess ? 'Đã bật đoán từ — nhấn Space để xem đáp án' : 'Đã tắt chế độ đoán từ'); }
function startPlay() { S.play = setInterval(() => { if (S.guess && !S.revealed) reveal(); else step(1); }, 4000); $('#stPlay').classList.add('on'); $('#stPlay').firstChild.textContent = '⏸ '; toast('Tự động phát: Bật'); }
function stopPlay() { if (!S.play) return; clearInterval(S.play); S.play = null; const b = $('#stPlay'); b.classList.remove('on'); b.firstChild.textContent = '▶ '; }
const togglePlay = () => S.play ? stopPlay() : startPlay();
function speak(word, lang = 'en-US', btnEl = $('#stAudio')) {
  if (!('speechSynthesis' in window)) return toast('Trình duyệt không hỗ trợ đọc giọng nói');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = lang;
  u.rate = .92;
  if (btnEl) {
    btnEl.classList.add('speaking');
    u.onend = u.onerror = () => btnEl.classList.remove('speaking');
  }
  speechSynthesis.speak(u);
}
function learnToggle() {
  const w = S.list[S.si]; if (!w) return;
  const on = toggleLearned(w); $('#stLearn').classList.toggle('on', on);
  const t = $(`#wgrid [data-n="${S.si}"]`); if (t) t.classList.toggle('is-done', on);
  toast(on ? 'Đã đánh dấu thuộc từ' : 'Đã bỏ đánh dấu thuộc');
}
function openLb(src) { if (!src) return; $('#lb img').src = src; $('#lb').classList.add('open'); }

/* ====================== wiring ====================== */
$('#stClose').onclick = closeStudy;
$('#stPrev').onclick = $('#stPrev2').onclick = () => step(-1);
$('#stNext').onclick = $('#stNext2').onclick = () => step(1);
$('#stReveal').onclick = reveal;
$('#stAudio').onclick = () => { const w = S.list[S.si]; w && speak(w.en, 'en-US', $('#stAudio')); };
$('#stAudioVi').onclick = () => { const w = S.list[S.si]; w && speak(w.w, 'vi-VN', $('#stAudioVi')); };
$('#stCmp').onclick = () => { const w = S.list[S.si]; w && toggleCmp(w); };
$('#stLearn').onclick = learnToggle; $('#stGuess').onclick = toggleGuess; $('#stPlay').onclick = togglePlay; $('#stShuf').onclick = toggleShuffle;
$('#stZoom').onclick = stImg.onclick = () => { const w = S.list[S.si]; w && openLb(w.ph); };
$('#lb').onclick = () => $('#lb').classList.remove('open');
let tx = null;
stStage.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
stStage.addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); }, { passive: true });

document.addEventListener('load', e => { if (e.target.tagName === 'IMG' && e.target.closest('.tile, .wc-img, .tc-img, .ci')) e.target.classList.add('in'); }, true);
document.addEventListener('error', e => { const t = e.target; if (t.tagName === 'IMG' && t.closest('.tile, .wc-img, .tc-img, .ci, .tr-th')) t.remove(); }, true);

document.addEventListener('click', e => {
  const b = e.target.closest('.cmp-btn');
  if (b) { e.preventDefault(); const w = fromKey(b.dataset.k); if (w) toggleCmp(w); return; }
  const rm = e.target.closest('[data-rm]');
  if (rm) { e.preventDefault(); const w = fromKey(rm.dataset.rm); const i = S.cmp.indexOf(w); if (i >= 0) { S.cmp.splice(i, 1); saveCmp(); if (S.r.name === 'compare') renderCompareBody(); } return; }
  if (e.target.closest('#trClear')) { S.cmp = []; saveCmp(); return; }
  const say = e.target.closest('[data-say]'); if (say) { speak(say.dataset.say, 'en-US', say); return; }
  const sayVi = e.target.closest('[data-say-vi]'); if (sayVi) { speak(sayVi.dataset.sayVi, 'vi-VN', sayVi); return; }
  if (e.target.closest('#cmpClear')) { S.cmp = []; saveCmp(); renderCompareBody(); return; }
  if (e.target.closest('#cmpFind')) { qi.focus(); qi.select(); return; }
  if (e.target.closest('#cmpCopy')) {
    const u = location.href.split('#')[0] + '#/compare?w=' + S.cmp.map(wkey).join(',');
    const ta = document.createElement('textarea'); ta.value = u; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Đã sao chép liên kết so sánh'); } catch (err) { toast('Hãy sao chép từ thanh địa chỉ'); }
    ta.remove();
  }
});

// search
const qi = $('#q'); let qt;
qi.addEventListener('input', () => {
  clearTimeout(qt); qt = setTimeout(() => {
    const v = qi.value.trim();
    if (!v) { if (S.r.name === 'search') go('#/', true); return; }
    go('#/search/' + encodeURIComponent(v), S.r.name === 'search');
  }, 220);
});
qi.addEventListener('keydown', e => { if (e.key === 'Escape') { qi.value = ''; qi.blur(); if (S.r.name === 'search') history.length > 1 ? history.back() : go('#/', true); } });

// theme, density, fullscreen
function setTheme(t) { document.documentElement.setAttribute('data-theme', t); store.set('vv.theme', t); }
$('#btnTheme').onclick = () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
function setDens(d) { document.body.dataset.dens = d; store.set('vv.dens', d); $$('.dens button').forEach(b => b.classList.toggle('on', b.dataset.d === d)); }
$$('.dens button').forEach(b => b.onclick = () => setDens(b.dataset.d));
const toggleFs = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen && document.exitFullscreen(); };
$('#btnFs').onclick = toggleFs;

// auto-hide header while scrolling down
let lastY = 0;
window.addEventListener('scroll', () => {
  const y = window.scrollY, h = $('#hdr');
  if (y > lastY + 6 && y > 220) h.classList.add('hide'); else if (y < lastY - 6 || y < 120) h.classList.remove('hide');
  lastY = y;
}, { passive: true });
function showHdr() { $('#hdr').classList.remove('hide'); lastY = 0; }

// keyboard
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === '/') { e.preventDefault(); qi.focus(); qi.select(); return; }
  if (k === 'f') return toggleFs();
  if (k === 'escape') { if ($('#lb').classList.contains('open')) $('#lb').classList.remove('open'); else closeStudy(); return; }
  if (S.studyOpen) {
    if (e.key === 'ArrowRight' || k === 'd') step(1);
    else if (e.key === 'ArrowLeft' || k === 'a') step(-1);
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (S.guess) toggleReveal(); else step(1); }
    else if (k === 'p') $('#stAudio').click();
    else if (k === 'v') $('#stAudioVi').click();
    else if (k === 'g') toggleGuess();
    else if (k === 's') toggleShuffle();
    else if (k === 'c') togglePlay();
    else if (k === 'k') learnToggle();
    else if (k === 'z') $('#stZoom').click();
  } else if (k === 's' && $('#tbShuf')) toggleShuffle();
});

/* ====================== boot ====================== */
S.view = store.get('vv.view', 'cards') === 'mosaic' ? 'mosaic' : 'cards';
setTheme(store.get('vv.theme', 'light'));
setDens(store.get('vv.dens', 'm'));
buildChips();
route(false);
})();
</script>
</body>
</html>
